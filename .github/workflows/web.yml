name: Build Veyrak Legacy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Godot 4.5.1 and web templates
        shell: bash
        run: |
          set -euo pipefail
          RELEASE="https://github.com/godotengine/godot/releases/download/4.5.1-stable"
          curl --fail --location --retry 3 "$RELEASE/Godot_v4.5.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.5.1-stable_linux.x86_64
          echo /tmp/godot >> "$GITHUB_PATH"
          curl --fail --location --retry 3 "$RELEASE/Godot_v4.5.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"
          unzip -j -q /tmp/templates.tpz 'templates/web*' -d "$HOME/.local/share/godot/export_templates/4.5.1.stable"
      - name: Validate, test and export
        run: |
          set -euo pipefail
          Godot_v4.5.1-stable_linux.x86_64 --headless --editor --import --path .
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/profile_test.gd
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/creator_test.gd
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/reference_creator_test.gd
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --script tests/save_slots_test.gd
          mkdir -p build/web
          Godot_v4.5.1-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          touch build/web/.nojekyll
      - name: Keep downloadable web build
        uses: actions/upload-artifact@v4
        with:
          name: veyrak-character-creator-web
          path: build/web
      - name: Prepare Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: export
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish browser build
        id: deployment
        uses: actions/deploy-pages@v4
